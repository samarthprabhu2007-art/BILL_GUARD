<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SubTrackr – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <h1>SubTrackr 💳</h1>
    <p class="subtitle">Manage your subscriptions. Never miss a payment.</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Login</button>
      <button class="tab-btn" id="tab-signup" onclick="showTab('signup')">Sign Up</button>
    </div>

    <!-- Alert Box -->
    <div class="alert" id="alert-box"></div>

    <!-- ===== LOGIN FORM ===== -->
    <div id="login-form">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="text" id="login-email" placeholder="you@example.com" />
        <div class="field-error" id="err-login-email">Enter a valid email address.</div>
      </div>
      <div class="form-group">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" placeholder="Your password" />
        <div class="field-error" id="err-login-pass">Password is required.</div>
      </div>
      <button class="auth-btn" onclick="handleLogin()">Login</button>
    </div>

    <!-- ===== SIGNUP FORM ===== -->
    <div id="signup-form" style="display:none;">
      <div class="form-group">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" placeholder="John Doe" />
        <div class="field-error" id="err-signup-name">Name must be at least 2 characters.</div>
      </div>
      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <input type="text" id="signup-email" placeholder="you@example.com" />
        <div class="field-error" id="err-signup-email">Enter a valid email (must contain @).</div>
      </div>
      <div class="form-group">
        <label for="signup-pass">Password</label>
        <input type="password" id="signup-pass" placeholder="Min 6 characters" />
        <div class="field-error" id="err-signup-pass">Password must be at least 6 characters.</div>
      </div>
      <div class="form-group">
        <label for="signup-confirm">Confirm Password</label>
        <input type="password" id="signup-confirm" placeholder="Repeat password" />
        <div class="field-error" id="err-signup-confirm">Passwords do not match.</div>
      </div>
      <button class="auth-btn" onclick="handleSignup()">Create Account</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
